      definizioni: CSC, CSR, sito potenzialmente contaminato/contaminato, MISE,
      MISO, bonifica), 242 (v. 11, procedure operative e amministrative), 244
      (v. 3, procedimento su iniziativa della PA), 249 (aree di ridotte
      dimensioni) e 257 (v. 2, sanzioni penali) sono caricati via AJAX
      (caricaArticolo) e trascritti verbatim in
      references/fonti/dlgs-152-2006.md. Gli allegati alla parte quarta
      (Allegato 5 - tabelle CSC; Allegato 1 - analisi di rischio; Allegato 2 -
      piano di caratterizzazione; Allegato 4 - procedure semplificate) e il DM
      criteri analisi di rischio sono citati come riferimento e NON riprodotti.

