# Fonte per l'AUTORIZZAZIONE INTEGRATA AMBIENTALE (AIA/IPPC): domanda, procedura di rilascio,
# contenuto e condizioni (VLE su BAT, monitoraggio), rinnovo e riesame, rispetto delle condizioni
# e controlli/ispezioni. Fonte: D.Lgs. 3 aprile 2006, n. 152, Parte II, Titolo III-bis, come
# modificato dal D.Lgs. 28 settembre 2026, n. 197 (recepimento IED2, in vigore dal 12/11/2026).

sources:
  - id: dlgs-152-2006-aia-titolo3bis
    title: "D.Lgs. 3 aprile 2006, n. 152 - Parte II, Titolo III-bis, artt. 29-ter, 29-quater, 29-sexies, 29-octies, 29-decies (AIA) (testo vigente al 2026-07-17)"
    type: decreto-legislativo
    url: https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2006-04-03;152!vig=2026-07-17
    accessed: 2026-07-17
    sha256: 6652cbbcfa814b819ef2601b8de1e8059bfc2fdc2f241ec2c83a2a3bdc495d31
    license: public-domain
    binary_path: not_in_repo/dlgs152_17.html
    md_path: references/fonti/dlgs-152-2006-aia-titolo3bis.md
    excerpt_path: references/estratti/aia-checklist.md
    notes: |
      Codice redazionale 006G0171 (G.U. 14 aprile 2006). Pagina indice Normattiva pinnata a
      !vig=2026-07-17 (hash stabile, doppio download: c2175fe5...). Articoli caricati via AJAX
      (caricaArticolo, idGruppo 9, dataPubblicazioneGazzetta 2006-04-14) e trascritti verbatim in
      references/fonti/dlgs-152-2006-aia-titolo3bis.md:
      - Art. 29-ter (idSottoArticolo 3, v3): domanda di AIA (contenuti a-m: descrizione
        installazione/attività, materie prime, emissioni, BAT proposte, relazione di riferimento per
        sostanze pericolose; verifica di completezza entro 30 gg, integrazioni).
      - Art. 29-quater (idSottoArticolo 4, v4): procedura per il rilascio (autorità competente,
        pubblicazione/deposito, osservazioni del pubblico, conferenza di servizi, coordinamento con
        VIA, termini, coordinamento con altre autorizzazioni assorbite).
      - Art. 29-sexies (idSottoArticolo 6, v5): contenuto e condizioni dell'AIA (VLE basati sulle
        BAT/conclusioni sulle BAT senza prescrivere tecniche, monitoraggio e autocontrollo, deroghe
        motivate, riferimento alle norme di qualità ambientale).
      - Art. 29-octies (idSottoArticolo 8, v2): rinnovo e riesame (riesame periodico; riesame entro 4
        anni dalla pubblicazione delle nuove conclusioni sulle BAT; casi di riesame).
      - Art. 29-decies (idSottoArticolo 10, v5): rispetto delle condizioni (comunicazione di
        attuazione; autocontrolli del gestore; accertamenti ISPRA/ARPA; ispezioni ordinarie con
        periodicità basata sul rischio - max 1/3 anni, 6 mesi dopo grave inosservanza; inosservanze:
        diffida, diffida con sospensione, revoca e chiusura).
      LIMITE DI RESA (Regola zero): gli Allegati VIII e XII (elenco delle attività IPPC e soglie) e i
      BREF/conclusioni sulle BAT sono tabellari/esterni e non riprodotti; artt. 5 (definizioni:
      installazione, gestore, modifica sostanziale), 6 c. 12-16, 29-bis, 29-quinquies, 29-septies,
      29-novies, 29-undecies, 29-quattuordecies (sanzioni) citati e non trascritti. La skill inquadra
      procedura/contenuto/controlli e non redige la domanda/AIA né individua le BAT applicabili.
      RIVERIFICA 2026-11-01: la stessa pagina indice pinnata (!vig=2026-07-17) restituisce ora, in
      modo stabile (doppio download), SHA256 6652cbbc... invece di c2175fe5... (variazione della
      pagina Normattiva). Le versioni degli articoli indicizzati sono invariate (29-ter v3, 29-quater
      v4, 29-sexies v5, 29-octies v2, 29-decies v5); riscaricati via caricaArticolo e confrontati
      frase per frase con la trascrizione: testo dei commi identico (differenze solo nell'interfaccia
      della pagina e nelle note AGGIORNAMENTO, omesse per scelta).

  - id: dlgs-197-2026-ied2
    title: "D.Lgs. 28 settembre 2026, n. 197 - Attuazione della direttiva (UE) 2024/1785 (IED2) - modifiche al D.Lgs. 152/2006 (GU SG n. 251 del 28-10-2026)"
    type: decreto-legislativo
    url: https://www.gazzettaufficiale.it/eli/gu/2026/10/28/251/sg/pdf
    accessed: 2026-11-01
    sha256: d4fd3721ccdf315a77119215ce1a976fe4b052238e71100b6f5948230fa2fe52
    license: public-domain
    binary_path: not_in_repo/gu-sg-251-2026-10-28.pdf
    md_path: references/fonti/dlgs-197-2026-ied2.md
    excerpt_path: references/estratti/aia-checklist.md
    notes: |
      Codice redazionale 26G00213. Pagina dell'atto: https://www.gazzettaufficiale.it/eli/id/2026/10/28/26G00213/sg
      (riporta "Entrata in vigore del provvedimento: 12/11/2026"). Il file hashato e' il fascicolo PDF
      integrale della GU SG n. 251 del 28-10-2026 (doppio download identico, 2026-11-01); il decreto
      occupa le pagg. 1-25 (testo) piu' le note redazionali. Letto per intero (Capo I artt. 1-42, Capo
      II artt. 43-45, Allegato A) ed estratto con pdftotext; trascritti verbatim in
      references/fonti/dlgs-197-2026-ied2.md gli articoli usati dalla skill: artt. 1, 2, 3 (artt. 4,
      5, 6 - ambito, definizioni, art. 6 c. 13), 5 (art. 8-bis Commissione AIA-IPPC), 7 (art. 10
      coordinamento VIA-AIA), 10 (art. 29-ter), 11 (art. 29-quater), 13 (art. 29-sexies), 14 (art.
      29-septies), 15 (art. 29-octies), 16 (art. 29-nonies), 17 (art. 29-decies), 20 (art.
      29-terdecies, INCITE), 22 (Titolo III-ter, artt. 29-quinquiesdecies - 29-septiesdecies c. 3),
      35 (Allegato VIII), 36 + Allegato A (nuovo Allegato VIII-bis), 37 (abrogazione Allegato X), 43
      (transitorie), 44 (abrogazioni). L'atto NON modifica l'Allegato XII.
      LIMITE: le modifiche sono lette sul testo dell'atto modificativo (novelle), non su un testo
      consolidato del D.Lgs. 152/2006 (vigenza dal 12/11/2026, successiva alla data di accesso). La
      fonte dlgs-152-2006-aia-titolo3bis resta il testo previgente (vig. 2026-07-17) e va riallineata
      al consolidato Normattiva dopo il 12/11/2026.
