# Fonte per gli adempimenti per le COSTRUZIONI IN ZONE SISMICHE: denuncia dei lavori e
# deposito del progetto (art. 93), autorizzazione preventiva all'inizio dei lavori (art.
# 94) e classificazione degli interventi strutturali rilevanti/di minore rilevanza/privi
# di rilevanza (art. 94-bis). Fonte: Testo unico dell'edilizia (DPR 380/2001), Capo IV.

sources:
  - id: dpr-380-2001-93-94-94bis
    title: "D.P.R. 6 giugno 2001, n. 380 (Testo unico edilizia) - artt. 93 (denuncia lavori), 94 (autorizzazione sismica) e 94-bis (disciplina interventi strutturali in zone sismiche) (testo vigente al 2026-07-17)"
    type: decreto-presidente-repubblica
    # URL pinnata con !vig=YYYY-MM-DD per riproducibilita' dell'hash sotto CI (stesso indice
    # del DPR 380 usato dalle altre skill edilizia).
