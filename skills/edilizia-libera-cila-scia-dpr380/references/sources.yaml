    accessed: 2026-11-15
    sha256: 12e7d5893462c1ec18f16a6a27c6666b540df2b157b4e82f288f0a64c337e8b3
    license: public-domain
    binary_path: not_in_repo/gu-sg-263-2026-11-11.pdf
    md_path: references/fonti/dl-205-2026-gu-263.md
    notes: |
      Fascicolo completo GU Serie Generale n. 263 dell'11/11/2026 (due download del
      2026-11-15 con hash identico); il D.L. 205/2026 occupa le pp. 71-89 (codice
      redazionale 26G00225), in vigore dal 12/11/2026 (art. 28: giorno successivo alla
      pubblicazione; confermato dalla pagina dell'atto), da presentare alle Camere per
      la conversione in legge. Trascritti art. 1 cc. 1, 4 lett. a-b, 5, 6; art. 9
      (consumo del suolo nella zona di intervento); art. 10 (Conferenza di servizi
      permanente, approvazione progetti pubblici ex art. 38 D.Lgs. 36/2023, ordinanze
      per il patrimonio edilizio privato); art. 12 (procedimento dei contributi per
      gli edifici privati: titolo edilizio ex art. 20 DPR 380, SCIA artt. 22-23,
      stato legittimo, condizioni di titolo); art. 13 (semplificazione: sanatorie e
      condoni sugli immobili oggetto di contributo); art. 16 (percentuale del
      contributo art. 1 c. 695 L. 207/2024); art. 18 cc. 1, 2, 4; art. 19; art. 28.
      RILIEVO PER QUESTA SKILL: art. 9: nella zona di intervento gli strumenti urbanistici comunali prevedono consumo di suolo da nuova costruzione o ristrutturazione edilizia (art. 3 c. 1 lett. d-e DPR 380) solo in casi eccezionali e previa dimostrazione dell'insostenibilita' tecnica ed economica di riqualificare o rigenerare aree gia' edificate;
      art. 12: domanda di contributo presentata con la richiesta del titolo, che il
      Comune rilascia ex art. 20 DPR 380 o verifica (SCIA artt. 22-23); stato legittimo
      riferito all'edificio; contributo solo con titolo, sanatoria o casi dell'art. 13;
      art. 13: semplificazione per sanatorie (PdC e SCIA, 60 giorni) e condoni sugli
      immobili oggetto di contributo, interventi realizzati prima del 1/8/2026.
      Da riverificare alla legge di conversione e alle ordinanze del Commissario.
