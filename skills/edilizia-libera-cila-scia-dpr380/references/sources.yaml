# costruire: attivita' edilizia libera (art. 6), CILA (art. 6-bis), SCIA (art. 22) e SCIA
# in alternativa al permesso di costruire (art. 23). Fonte: Testo unico dell'edilizia
# (DPR 380/2001), Titolo II.

